# docker-compose.yml — CS332 | Distributed SGD + QSGD Compression
#
# Usage:
#   # 4 workers, 4-bit compression:
#   WORLD_SIZE=4 NUM_BITS=4 RUN_ID=exp docker compose up
#
#   # 2 workers only:
#   WORLD_SIZE=2 NUM_BITS=8 docker compose up orchestrator worker_0 worker_1
#
#   # Failure scenario:
#   WORLD_SIZE=4 NUM_BITS=4 CRASH_RANK=1 CRASH_ITER=200 RUN_ID=failure docker compose up
#
# DIST_BACKEND defaults to nccl (GPU). Set DIST_BACKEND=gloo for CPU-only.

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: Dockerfile
  shm_size: '2gb'
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  volumes:
    - ./src:/app/src
    - ./results:/results
    - cifar10_data:/data/cifar10
  environment:
    - MASTER_ADDR=worker_0
    - MASTER_PORT=29500
    - WORLD_SIZE=${WORLD_SIZE:-4}
    - DIST_BACKEND=${DIST_BACKEND:-nccl}
    - NUM_BITS=${NUM_BITS:-8}
    - EPOCHS=${EPOCHS:-10}
    - BATCH_SIZE=${BATCH_SIZE:-128}
    - MODEL=${MODEL:-resnet18}
    - LR=${LR:-0.01}
    - RUN_ID=${RUN_ID:-exp}
    - RESULTS_DIR=/results
    - ORCHESTRATOR_HOST=orchestrator
    - STRAGGLER_RANK=${STRAGGLER_RANK:-}
    - STRAGGLER_DELAY_MS=${STRAGGLER_DELAY_MS:-0}
    - STRAGGLER_START_ITER=${STRAGGLER_START_ITER:-10}
    - CRASH_RANK=${CRASH_RANK:-}
    - CRASH_ITER=${CRASH_ITER:-200}
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  networks:
    - cluster_net
  depends_on:
    - orchestrator
  restart: "no"

services:

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: python /app/src/orchestrator.py --world-size ${WORLD_SIZE:-4} --port 29600
    environment:
      - RUN_ID=${RUN_ID:-exp}
      - RESULTS_DIR=/results
    volumes:
      - ./src:/app/src
      - ./results:/results
    networks:
      - cluster_net
    ports:
      - "29600:29600/udp"
    mem_limit: 256m

  worker_0:
    <<: *worker-common
    hostname: worker_0
    environment:
      - MASTER_ADDR=worker_0
      - MASTER_PORT=29500
      - WORLD_SIZE=${WORLD_SIZE:-4}
      - RANK=0
      - DIST_BACKEND=${DIST_BACKEND:-nccl}
      - NUM_BITS=${NUM_BITS:-8}
      - EPOCHS=${EPOCHS:-10}
      - BATCH_SIZE=${BATCH_SIZE:-128}
      - MODEL=${MODEL:-resnet18}
      - LR=${LR:-0.01}
      - RUN_ID=${RUN_ID:-exp}
      - RESULTS_DIR=/results
      - ORCHESTRATOR_HOST=orchestrator
      - STRAGGLER_RANK=${STRAGGLER_RANK:-}
      - STRAGGLER_DELAY_MS=${STRAGGLER_DELAY_MS:-0}
      - STRAGGLER_START_ITER=${STRAGGLER_START_ITER:-10}
      - CRASH_RANK=${CRASH_RANK:-}
      - CRASH_ITER=${CRASH_ITER:-200}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "29500:29500"

  worker_1:
    <<: *worker-common
    hostname: worker_1
    environment:
